<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Ceremonial matcha">
  <defs>
    <linearGradient id="bg-4" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1A1208" />
      <stop offset="100%" stop-color="#22301C" />
    </linearGradient>
    <radialGradient id="glow-4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3C46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3C46A" stop-opacity="0" />
    </radialGradient>
    
  <filter id="soft-4" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40" />
  </filter>
    
  <filter id="grain-4" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="28" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
    <feBlend in2="SourceGraphic" mode="overlay" />
  </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg-4)" />
  <g filter="url(#grain-4)">
      <circle cx="600" cy="700" r="330" fill="#7C8B52" opacity="0.9" />
      <circle cx="600" cy="700" r="330" fill="url(#glow-4)" opacity="0.5" />
      <path d="M330 700 A 270 270 0 0 0 870 700 Z" fill="#F7EFE2" opacity="0.14" />
      <g stroke="#F7EFE2" stroke-width="14" stroke-linecap="round" opacity="0.55" fill="none">
        <path d="M460 1090 C 540 1000 660 1000 740 1090" />
        <path d="M420 1180 C 530 1075 670 1075 780 1180" />
      </g>
      <circle cx="600" cy="700" r="120" fill="#F3C46A" opacity="0.22" /></g>
  <rect width="1200" height="1500" fill="none" />
</svg>
