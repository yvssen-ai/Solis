<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Storefront at first light">
  <defs>
    <linearGradient id="bg-1" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1A1208" />
      <stop offset="100%" stop-color="#3A2716" />
    </linearGradient>
    <radialGradient id="glow-1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3C46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3C46A" stop-opacity="0" />
    </radialGradient>
    
  <filter id="soft-1" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40" />
  </filter>
    
  <filter id="grain-1" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
    <feBlend in2="SourceGraphic" mode="overlay" />
  </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg-1)" />
  <g filter="url(#grain-1)">
      <circle cx="600" cy="560" r="300" fill="#E9A227" opacity="0.95" />
      <circle cx="600" cy="560" r="300" fill="url(#glow-1)" />
      <rect x="180" y="860" width="840" height="520" rx="18" fill="#1A1208" opacity="0.72" />
      <rect x="250" y="930" width="300" height="380" rx="10" fill="#F3C46A" opacity="0.28" />
      <rect x="650" y="930" width="300" height="380" rx="10" fill="#F3C46A" opacity="0.18" />
      <rect x="180" y="840" width="840" height="26" rx="13" fill="#B7541F" /></g>
  <rect width="1200" height="1500" fill="none" />
</svg>
