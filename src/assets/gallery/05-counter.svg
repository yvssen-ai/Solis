<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="The counter">
  <defs>
    <linearGradient id="bg-5" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3A2716" />
      <stop offset="100%" stop-color="#B7541F" />
    </linearGradient>
    <radialGradient id="glow-5" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3C46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3C46A" stop-opacity="0" />
    </radialGradient>
    
  <filter id="soft-5" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40" />
  </filter>
    
  <filter id="grain-5" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="35" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
    <feBlend in2="SourceGraphic" mode="overlay" />
  </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg-5)" />
  <g filter="url(#grain-5)">
      <rect x="0" y="900" width="1200" height="600" fill="#1A1208" opacity="0.6" />
      <rect x="0" y="880" width="1200" height="34" fill="#F3C46A" opacity="0.8" />
      <rect x="210" y="640" width="140" height="240" rx="70" fill="#E9A227" opacity="0.85" /><rect x="430" y="662" width="140" height="218" rx="70" fill="#F7EFE2" opacity="0.85" /><rect x="650" y="684" width="140" height="196" rx="70" fill="#E9A227" opacity="0.85" /><rect x="870" y="706" width="140" height="174" rx="70" fill="#F7EFE2" opacity="0.85" />
      <circle cx="240" cy="280" r="180" fill="#E9A227" opacity="0.75" filter="url(#soft-5)" /></g>
  <rect width="1200" height="1500" fill="none" />
</svg>
