      <stop offset="0%" stop-color="#B7541F" />
      <stop offset="100%" stop-color="#3A2716" />
    </linearGradient>
    <radialGradient id="glow-3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3C46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3C46A" stop-opacity="0" />
    </radialGradient>
    
  <filter id="soft-3" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40" />
  </filter>
    
  <filter id="grain-3" x="0" y="0" width="100%" height="100%">
