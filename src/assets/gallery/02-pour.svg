<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="The pour">
  <defs>
    <linearGradient id="bg-2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3A2716" />
      <stop offset="100%" stop-color="#1A1208" />
    </linearGradient>
    <radialGradient id="glow-2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F3C46A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F3C46A" stop-opacity="0" />
    </radialGradient>
    
  <filter id="soft-2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="40" />
  </filter>
    
  <filter id="grain-2" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="14" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
    <feBlend in2="SourceGraphic" mode="overlay" />
  </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg-2)" />
  <g filter="url(#grain-2)">
      <ellipse cx="600" cy="980" rx="330" ry="330" fill="#B7541F" opacity="0.55" filter="url(#soft-2)" />
      <circle cx="600" cy="960" r="250" fill="#F7EFE2" opacity="0.92" />
      <circle cx="600" cy="960" r="185" fill="#3A2716" />
      <path d="M600 300 C 640 520 660 700 600 775" stroke="#F3C46A" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.85" />
      <circle cx="600" cy="960" r="96" fill="#F3C46A" opacity="0.35" /></g>
  <rect width="1200" height="1500" fill="none" />
</svg>
